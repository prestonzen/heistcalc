name = "heistcalc"
main = "worker/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
routes = [
  { pattern = "heistcalc.com", custom_domain = true },
  { pattern = "www.heistcalc.com", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true
