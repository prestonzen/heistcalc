name = "heistcalc"
main = "worker/index.js"
compatibility_date = "2025-09-01"
workers_dev = true
routes = [
  { pattern = "heistcalc.com", custom_domain = true },
  { pattern = "www.heistcalc.com", custom_domain = true },
]

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = true

[[d1_databases]]
binding = "DB"
database_name = "heistcalc"
database_id = "88411821-e4db-4713-9b66-ab48a7d79d99"
migrations_dir = "migrations"

[triggers]
crons = ["* * * * *"]

# Build the Astro site before every deploy (also used by Cloudflare Workers Builds).
[build]
command = "npm run build"
